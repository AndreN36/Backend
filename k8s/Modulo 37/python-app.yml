name: Python application

on:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.9"
  IMAGE_NAME: fastapi-app
  IMAGE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Instalar Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Configurar cache do Poetry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Instalar dependências
        working-directory: ./
        run: |
          ls -lah
          poetry config virtualenvs.in-project true
          poetry install --no-root --no-interaction

      - name: Rodar testes com pytest
        working-directory: ./
        run: |
          poetry run pytest

      - name: Build da imagem Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Executar container Docker
        run: |
          docker run -d --name fastapi-container -p 8000:8000 ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verificar container em execução
        run: |
          docker ps
          docker logs fastapi-container

      - name: Parar e remover container
        if: always()
        run: |
          docker stop fastapi-container || true
          docker rm fastapi-container || true